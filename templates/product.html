<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10110f">
  <meta name="description" content="$summary">
  <title>$name — Xtrunn</title>
  <link rel="icon" href="../assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/site.css">
  <script src="../assets/appearance.js" defer></script>
  <script src="../assets/portal.js" defer></script>
</head>
<body class="project-page">
  <header class="topbar wrap">
    <a class="wordmark" href="../" aria-label="Xtrunn, accueil"><img src="../assets/mark.svg" alt="" width="30" height="30"><span>xtrunn</span></a>
    <nav aria-label="Navigation principale">
      <details class="nav-projects">
        <summary>Projets <span aria-hidden="true">⌄</span></summary>
        <div class="nav-projects-panel">
          <a href="../#projets">Voir les projets</a>
          <a href="../proposer.html">Proposer un projet</a>
        </div>
      </details>
      <a href="../privacy.html">Confidentialité</a>
      <a class="nav-contact" href="https://github.com/Xtrunn/xtrunn-site/issues">Contact <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main class="product-page wrap">
    <a class="back-link" href="../#projets">← Tous les projets</a>
    <section class="product-hero" style="--project-color: $color">
      <img class="product-icon" src="../$icon" width="104" height="104" alt="">
      <p class="eyebrow">$category · $publisher</p>
      <h1>$name</h1>
      <p class="product-summary">$summary</p>
      <p class="hero-description">$description</p>
$downloads
    </section>
$features
$pricing
  </main>
  <footer class="footer wrap">
    <a class="wordmark footer-mark" href="../"><img src="../assets/mark.svg" alt="" width="24" height="24"><span>xtrunn</span></a>
    <span>Logiciels et créations indépendantes.</span>
    <div><a href="../privacy.html">Confidentialité</a><a href="https://github.com/Xtrunn/xtrunn-site/issues">Contact</a></div>
  </footer>
</body>
</html>
